name: OVbord V5.6 – cloudcontroles

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v56-concept-c

permissions:
  contents: read

jobs:
  qa:
    name: npm ci, TypeScript, Node-tests en diff-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Haal broncode en volledige historie op
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: npm ci
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Node-tests
        run: node --test tests/*.test.cjs
      - name: Controleer whitespace sinds V5.5
        run: git diff --check origin/v55-apk-test...HEAD
